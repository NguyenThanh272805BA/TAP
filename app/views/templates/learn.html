{% extends "base.html" %}

{% block title %}TRAINING CHAMBER{% endblock %}

{% block content %}
<div class="bento-container" style="grid-template-columns: repeat(4, 1fr); max-width: 1500px; margin: 0 auto; gap: 25px;">

    <div class="bento-card card-tall" style="grid-column: span 1; display: flex; flex-direction: column; min-height: 650px; padding: 24px;">
        <div class="pixel-title" id="library-title" style="color: var(--neon-amber); font-size: 11px; text-align: center; border-bottom: 2px solid var(--glass-border); padding-bottom: 15px; letter-spacing: 1px;">
            DATA_LIBRARY
        </div>

        <div id="library-content" style="flex-grow: 1; overflow-y: auto; max-height: 72vh; margin-top: 15px; padding-right: 8px;">
            <div class="typing-effect" style="color: var(--neon-cyan); font-size: 13px;">Đang trích xuất dữ liệu lõi...</div>
        </div>
    </div>

    <div class="bento-card card-large" id="battle-card" style="grid-column: span 3; display: flex; flex-direction: column; min-height: 650px; padding: 40px;">
        <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 30px;">
            <div class="pixel-title" id="training-title" style="font-size: 13px; color: var(--neon-cyan); letter-spacing: 1px;">
                TRAINING_CHAMBER // LOADING...
            </div>

            <div style="width: 80px; height: 40px; transform: scale(1.2); transform-origin: top right;">
                <div class="character-container">
                    <div class="character">
                        <div class="head">
                            <div class="hair-back"></div>
                            <div class="face">
                                <div class="hair-front"></div>
                                <div class="eyes">
                                    <div class="eye left"><div class="pupil"></div></div>
                                    <div class="eye right"><div class="pupil"></div></div>
                                </div>
                                <div class="blush left"></div>
                                <div class="blush right"></div>
                                <div class="mouth"></div>
                            </div>
                        </div>
                        <div class="body">
                            <div class="shirt"><div class="collar"></div></div>
                            <div class="arms"><div class="arm left"></div><div class="arm right"></div></div>
                        </div>
                        <div class="legs"><div class="leg left"></div><div class="leg right"></div></div>
                    </div>
                </div>
            </div>
        </div>

        <div id="dynamic-workspace" style="flex-grow: 1; min-height: 380px; display: flex; flex-direction: column; justify-content: flex-start; gap: 15px;">
        </div>

        <div class="ai-dialog-box" id="aiResponseBox" style="display: none; border-color: var(--neon-pink); margin-top: 25px; padding: 25px; background: rgba(10, 10, 20, 0.95);">
            <div class="pixel-title" style="color: var(--neon-pink); margin-bottom: 12px; font-size: 11px; letter-spacing: 0.5px;">MASTER_G FEEDBACK:</div>
            <div id="aiFeedback" class="pixel-text" style="font-size: 16px; color: #fff; line-height: 1.6;"></div>
        </div>
    </div>

</div>
{% endblock %}

{% block extra_js %}
<script>
    let globalVocabData = {};
    let currentExamData = [];

    document.addEventListener("DOMContentLoaded", () => {
        const mode = localStorage.getItem("selected_learning_mode") || "grammar";
        const title = document.getElementById("training-title");
        const libTitle = document.getElementById("library-title");

        if (mode === 'vocab') {
            title.textContent = "TRAINING_CHAMBER // VOCABULARY";
            title.style.color = "var(--neon-cyan)";
            libTitle.textContent = "VOCAB_UNITS";
            libTitle.style.color = "var(--neon-cyan)";
            fetchLibraryData('/api/game/vocabularies', mode);
        } else {
            title.textContent = "TRAINING_CHAMBER // GRAMMAR";
            title.style.color = "var(--neon-amber)";
            libTitle.textContent = "GRAMMAR_RULES";
            libTitle.style.color = "var(--neon-amber)";
            fetchLibraryData('/api/game/grammars', mode);
        }

        if(typeof switchFeature === 'function') {
            switchFeature(mode);
        }
    });

    function fetchLibraryData(apiUrl, mode) {
        fetch(apiUrl)
        .then(res => res.json())
        .then(data => {
            if (mode === 'vocab') {
                const list = data.vocabularies;
                globalVocabData = {};
                list.forEach(item => {
                    const themeName = item.theme || "General";
                    if(!globalVocabData[themeName]) globalVocabData[themeName] = [];
                    globalVocabData[themeName].push(item);
                });
                renderThemesList();
            } else {
                const container = document.getElementById("library-content");
                let html = "";
                data.grammars.forEach(g => {
                    html += `
                    <div style="margin-bottom: 18px; background: rgba(0,0,0,0.4); padding: 14px; border-radius: 8px; border-left: 3px solid var(--neon-amber);">
                        <strong style="color: var(--neon-amber); font-family: var(--text-mono); font-size: 15px; display: block; margin-bottom: 6px;">${g.structure}</strong>
                        <span style="font-size: 14px; color: #cbd5e1; display: block; margin-bottom: 8px; line-height: 1.5;">${g.explanation}</span>
                        <div style="font-family: var(--text-mono); font-size: 13px; color: #94a3b8; background: rgba(255,255,255,0.05); padding: 8px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.05);">
                            Ex: ${g.example}
                        </div>
                    </div>`;
                });
                container.innerHTML = html;
            }
        })
        .catch(err => {
            document.getElementById("library-content").innerHTML = "<span style='color:var(--neon-pink)'>[ ERROR ] Mất kết nối tới Database lõi!</span>";
        });
    }

    function renderThemesList() {
        const container = document.getElementById("library-content");
        let html = `
        <button class="pixel-btn pulse-neon" onclick="startExamMode()" style="background: rgba(0,0,0,0.8); border: 2px solid var(--neon-amber); width: 100%; margin-bottom: 20px; font-size: 10px; padding: 15px;">
            [!] THỬ THÁCH NHỒI 50 TỪ (EXAM) [!]
        </button>

        <div style="background: rgba(0,0,0,0.6); padding: 15px; border-radius: 8px; border: 2px dashed var(--neon-purple); margin-bottom: 25px;">
            <div style="color: var(--neon-purple); font-family: var(--text-pixel); font-size: 9px; margin-bottom: 10px;">[ CREATE_NEW_UNIT ]</div>
            <input type="text" id="newTopicInput" placeholder="VD: Thể thao eSports..."
                   style="width: 100%; background: rgba(0,0,0,0.4); border: 1px solid var(--glass-border); color: #fff; padding: 10px; font-family: var(--text-mono); font-size: 14px; border-radius: 4px; box-sizing: border-box; margin-bottom: 10px;">
            <button id="btn-generate-unit" onclick="generateCustomUnit()" class="pixel-btn" style="background: var(--neon-purple); width: 100%; font-size: 10px; padding: 8px; box-shadow: -2px 0 0 0 #000, 2px 0 0 0 #000, 0 -2px 0 0 #000, 0 2px 0 0 #000, inset -2px -2px 0 0 #6b21a8;">
                YÊU CẦU AI ĐÚC UNIT
            </button>
        </div>

        <div style="color: #94a3b8; font-size: 13px; margin-bottom: 15px;">HOẶC CHỌN UNIT CÓ SẴN:</div>
        `;

        for (const theme of Object.keys(globalVocabData)) {
            html += `
            <div onclick="renderWordsList('${theme}')"
                 style="cursor: pointer; background: rgba(0,0,0,0.4); border: 2px solid var(--glass-border); border-radius: 8px; padding: 15px; margin-bottom: 15px; transition: 0.2s;"
                 onmouseover="this.style.borderColor='var(--neon-cyan)'"
                 onmouseout="this.style.borderColor='var(--glass-border)'">
                <strong style="color: var(--neon-cyan); font-size: 15px; display: block; margin-bottom: 5px;">[ ${theme.toUpperCase()} ]</strong>
                <span style="color: #cbd5e1; font-size: 13px;">Gồm ${globalVocabData[theme].length} từ vựng</span>
            </div>`;
        }
        container.innerHTML = html;
    }

    function renderWordsList(theme) {
        const container = document.getElementById("library-content");
        const words = globalVocabData[theme];

        let html = `
        <button onclick="renderThemesList()" class="pixel-btn" style="background: transparent; border: none; box-shadow: none; color: var(--neon-pink); padding: 0; margin-bottom: 20px;">
            < QUAY LẠI CÁC UNITS
        </button>
        <div style="color: var(--neon-cyan); font-family: var(--text-pixel); font-size: 10px; margin-bottom: 15px;">UNIT ĐANG HỌC: ${theme.toUpperCase()}</div>
        `;

        words.forEach((w, index) => {
            const opacity = w.is_unlocked ? "1" : "0.5";
            const icon = w.is_unlocked ? "[ UNLOCKED ]" : "[ LOCKED ]";
            const safeWord = w.word.replace(/'/g, "\\'");
            const memoText = w.is_memorized ? "[ X ] ĐÃ THUỘC" : "[ _ ] CHƯA THUỘC";
            const memoColor = w.is_memorized ? "var(--pixel-green)" : "var(--glass-border)";

            html += `
            <div style="margin-bottom: 12px; background: rgba(0,0,0,0.6); border-left: 3px solid var(--neon-cyan); padding: 12px; border-radius: 6px; opacity: ${opacity};">
                <div onclick="toggleWordDetail(${index})" style="cursor: pointer; display: flex; justify-content: space-between; align-items: center;">
                    <strong style="color: var(--neon-cyan); font-size: 16px; font-family: var(--text-main); font-weight: 600;">${w.word}</strong>
                    <span style="font-size: 9px; color: #cbd5e1; font-family: var(--text-pixel);">${icon}</span>
                </div>

                <div id="word-detail-${index}" style="display: none; margin-top: 10px; padding-top: 10px; border-top: 1px dashed rgba(255,255,255,0.2);">
                    <span style="font-size: 14px; color: #cbd5e1; display: block; line-height: 1.5; margin-bottom: 12px;">Nghĩa: ${w.meaning}</span>

                    <div style="display: flex; gap: 8px;">
                        <button class="pixel-btn" onclick="requestWordGuide('${safeWord}')" style="background: var(--neon-purple); box-shadow: -2px 0 0 0 #000, 2px 0 0 0 #000, 0 -2px 0 0 #000, 0 2px 0 0 #000; font-size: 9px; padding: 8px; flex: 1;">
                            MASTER G HƯỚNG DẪN
                        </button>

                        <button class="pixel-btn" onclick="toggleMemorizeStatus(${w.id})" style="background: ${memoColor}; box-shadow: -2px 0 0 0 #000, 2px 0 0 0 #000, 0 -2px 0 0 #000, 0 2px 0 0 #000; font-size: 9px; padding: 8px; flex: 1;">
                            ${memoText}
                        </button>
                    </div>
                </div>
            </div>`;
        });

        container.innerHTML = html;
    }

    function toggleWordDetail(index) {
        const detailDiv = document.getElementById('word-detail-' + index);
        detailDiv.style.display = detailDiv.style.display === 'none' ? 'block' : 'none';
    }

    function toggleMemorizeStatus(vocabId) {
        const userId = localStorage.getItem("user_id");
        if (!userId) {
            alert("Vui lòng đăng nhập lại để lưu tiến độ!");
            return;
        }

        fetch('/api/game/vocab/toggle_memorize', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ vocab_id: vocabId, user_id: userId })
        })
        .then(res => res.json())
        .then(data => {
            if(data.error) {
                alert(data.error);
                return;
            }
            if (data.level_upgraded) {
                alert(`*** CHÚC MỪNG! BẠN ĐÃ THUỘC TOÀN BỘ CHỦ ĐỀ.\nDanh hiệu mới của bạn là: ${data.current_level} ***`);
            }
            fetchLibraryData('/api/game/vocabularies', 'vocab');
        })
        .catch(err => console.error("Lỗi cập nhật tiến độ:", err));
    }

    function requestWordGuide(word) {
        const aiResponseBox = document.getElementById("aiResponseBox");
        const aiFeedback = document.getElementById("aiFeedback");
        const userInput = document.getElementById("userInput");
        if(userInput) {
            userInput.value = word + " ";
            userInput.focus();
        }

        aiResponseBox.style.display = "block";
        aiFeedback.innerHTML = `<span style="color: var(--neon-amber);" class="pulse-neon">Master G đang soạn giáo án phân tích từ '${word}'... Đợi xíu!</span>`;

        fetch('/api/ai/guide', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ word: word })
        })
        .then(res => res.json())
        .then(data => {
            aiFeedback.innerHTML = data.guide;
        })
        .catch(err => {
            aiFeedback.innerHTML = "<span style='color:var(--neon-pink)'>Lỗi kết nối tới não bộ AI! Đứt cáp rồi!</span>";
        });
    }

    function generateCustomUnit() {
        const topicInput = document.getElementById("newTopicInput");
        const btnGenerate = document.getElementById("btn-generate-unit");
        const topic = topicInput.value.trim();

        if (!topic) {
            alert("Cảnh báo: Bạn chưa nhập tên chủ đề!");
            return;
        }

        topicInput.disabled = true;
        btnGenerate.disabled = true;
        btnGenerate.style.background = "var(--neon-amber)";
        btnGenerate.innerHTML = "ĐANG RÈN TỪ VỰNG... ĐỢI XÍU!";

        fetch('/api/ai/generate_unit', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ topic: topic })
        })
        .then(res => res.json())
        .then(data => {
            if (data.error) {
                alert(data.error);
            } else {
                alert(data.message);
                fetchLibraryData('/api/game/vocabularies', 'vocab');
            }
        })
        .catch(err => {
            alert("Lỗi kết nối tới lò đúc AI!");
        })
        .finally(() => {
            topicInput.disabled = false;
            topicInput.value = "";
            btnGenerate.disabled = false;
            btnGenerate.style.background = "var(--neon-purple)";
            btnGenerate.innerHTML = "YÊU CẦU AI ĐÚC UNIT";
        });
    }

    // ==========================================================
    // CẬP NHẬT TRONG CHẾ ĐỘ EXAM 50 TỪ TRÊN TERMINAL RỘNG
    // ==========================================================
    function startExamMode() {
        const userId = localStorage.getItem("user_id");
        if (!userId) return alert("Vui lòng đăng nhập!");

        document.getElementById("training-title").textContent = "BATTLE_ZONE // EXAM_50_WORDS";
        document.getElementById("training-title").style.color = "var(--neon-pink)";

        const workspace = document.getElementById("dynamic-workspace");
        workspace.innerHTML = `<div class="typing-effect" style="color: var(--neon-amber); font-family: var(--text-mono);">Đang thiết lập ma trận từ vựng...</div>`;

        fetch('/api/game/exam/generate', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ user_id: userId })
        })
        .then(res => res.json())
        .then(data => {
            currentExamData = data.exam;
            renderExamPaper();
        })
        .catch(err => {
            workspace.innerHTML = `<div style="color: var(--neon-pink); font-family: var(--text-mono);">Lỗi kết nối tới Server Đề Thi!</div>`;
        });
    }

    function renderExamPaper() {
        const workspace = document.getElementById("dynamic-workspace");
        let html = `
        <div style="margin-bottom: 15px; color: #94a3b8; font-size: 14px; line-height: 1.6;">
            Nhiệm vụ: Nhập nghĩa tiếng Việt. Những từ bạn đánh dấu "Chưa thuộc" sẽ tiếp tục ám ảnh bạn vào lần kiểm tra sau!
        </div>
        <div id="exam-list" style="max-height: 480px; overflow-y: auto; padding-right: 10px;">`;

        currentExamData.forEach((item, index) => {
            html += `
            <div class="bento-card" style="margin-bottom: 15px; padding: 18px; background: rgba(0,0,0,0.4);">
                <div style="font-family: var(--text-main); font-size: 18px; color: var(--neon-cyan); margin-bottom: 10px; font-weight: 600; letter-spacing: 0.5px;">
                    [${index + 1}] ${item.word}
                </div>
                <input type="text" id="exam-input-${item.id}" placeholder="Nhập nghĩa tiếng Việt..."
                       style="width: 100%; background: rgba(0,0,0,0.5); border: 1px solid var(--glass-border); color: #fff; padding: 12px; font-family: var(--text-mono); font-size: 15px; border-radius: 4px; box-sizing: border-box;">

                <div id="exam-result-${item.id}" style="display: none; margin-top: 15px; padding-top: 15px; border-top: 1px dashed rgba(255,255,255,0.2);">
                    <div style="color: var(--neon-amber); font-size: 14px; margin-bottom: 15px; font-weight: 500;">Nghĩa đúng: ${item.meaning}</div>
                    <div style="display: flex; gap: 10px;">
                        <button class="pixel-btn" id="btn-thuoc-${item.id}" onclick="setExamStatus(${item.id}, 'DA_THUOC')" style="background: rgba(0,0,0,0.5); border: 2px solid var(--pixel-green); flex: 1; padding: 8px;">ĐÃ THUỘC</button>
                        <button class="pixel-btn" id="btn-hoi-${item.id}" onclick="setExamStatus(${item.id}, 'HOI_THUOC')" style="background: rgba(0,0,0,0.5); border: 2px solid var(--neon-amber); flex: 1; padding: 8px;">HƠI THUỘC</button>
                        <button class="pixel-btn" id="btn-chua-${item.id}" onclick="setExamStatus(${item.id}, 'CHUA_THUOC')" style="background: rgba(0,0,0,0.5); border: 2px solid var(--neon-pink); flex: 1; padding: 8px;">CHƯA THUỘC</button>
                    </div>
                </div>
            </div>`;
        });

        html += `
        </div>
        <button class="pixel-btn" onclick="submitExam()" style="background: var(--neon-pink); width: 100%; margin-top: 20px; font-size: 12px; padding: 15px;">
            NỘP BÀI & ĐỐI CHIẾU
        </button>
        `;
        workspace.innerHTML = html;
    }

    function submitExam() {
        currentExamData.forEach(item => {
            const inputField = document.getElementById(`exam-input-${item.id}`);
            if (inputField) inputField.disabled = true;
            const resultDiv = document.getElementById(`exam-result-${item.id}`);
            if (resultDiv) resultDiv.style.display = "block";
        });
        alert("*** Đã nộp bài! Hãy tự đối chiếu và đánh giá mức độ ghi nhớ nhé! ***");
    }

    function setExamStatus(vocabId, level) {
        const userId = localStorage.getItem("user_id");

        document.getElementById(`btn-thuoc-${vocabId}`).style.background = "rgba(0,0,0,0.5)";
        document.getElementById(`btn-hoi-${vocabId}`).style.background = "rgba(0,0,0,0.5)";
        document.getElementById(`btn-chua-${vocabId}`).style.background = "rgba(0,0,0,0.5)";

        if(level === 'DA_THUOC') document.getElementById(`btn-thuoc-${vocabId}`).style.background = "var(--pixel-green)";
        if(level === 'HOI_THUOC') document.getElementById(`btn-hoi-${vocabId}`).style.background = "var(--neon-amber)";
        if(level === 'CHUA_THUOC') document.getElementById(`btn-chua-${vocabId}`).style.background = "var(--neon-pink)";

        fetch('/api/game/exam/update_status', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ user_id: userId, vocab_id: vocabId, level: level })
        });
    }
</script>
{% endblock %}
