<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Fluent - Portal Authentication</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <div class="bento-container" style="margin-top: 10vh; max-width: 500px;">

        <div class="bento-card" style="grid-column: span 4; padding: 40px;">
            <div class="pixel-title" id="auth-title" style="font-size: 14px; color: var(--neon-cyan); text-align: center; margin-bottom: 30px; letter-spacing: 1px;">
                LOGIN_TO_ACCOUNT
            </div>

            <div style="margin-bottom: 20px;">
                <div class="pixel-title" style="font-size: 10px; margin-bottom: 8px;">PLAYER_NAME:</div>
                <input type="text" id="username" style="width: 100%; background: rgba(0,0,0,0.5); border: 2px solid var(--glass-border); color: #fff; padding: 12px; font-family: var(--text-mono); font-size: 15px; border-radius: 8px; box-sizing: border-box;">
            </div>

            <div style="margin-bottom: 30px;">
                <div class="pixel-title" style="font-size: 10px; margin-bottom: 8px;">ACCESS_PASSWORD:</div>
                <input type="password" id="password" style="width: 100%; background: rgba(0,0,0,0.5); border: 2px solid var(--glass-border); color: #fff; padding: 12px; font-family: var(--text-mono); font-size: 15px; border-radius: 8px; box-sizing: border-box;">
            </div>

            <div style="display: flex; flex-direction: column; gap: 15px;">
                <button class="pixel-btn" style="background: var(--pixel-green); width: 100%;" onclick="handleAuth('login')">EXECUTE_LOGIN</button>
                <button class="pixel-btn" style="background: #3b82f6; width: 100%;" onclick="handleAuth('register')">CREATE_NEW_HERO (REGISTER)</button>
            </div>

            <div class="pixel-text" id="auth-msg" style="font-size: 14px; color: var(--neon-pink); margin-top: 20px; text-align: center; display: none;"></div>
        </div>

    </div>

    <script>
        function handleAuth(type) {
            const user = document.getElementById("username").value.trim();
            const pass = document.getElementById("password").value.trim();
            const msg = document.getElementById("auth-msg");

            if(!user || !pass) {
                msg.style.display = "block";
                msg.innerText = "LỖI: Không được bỏ trống thông tin!";
                return;
            }

            msg.style.display = "block";
            msg.style.color = "var(--neon-amber)";
            msg.innerText = "ĐANG XỬ LÝ DỮ LIỆU CỐT LÕI...";

            fetch(`/api/auth/${type}`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ username: user, password: pass })
            })
            .then(res => res.json().then(data => ({ status: res.status, body: data })))
            .then(obj => {
                if(obj.status === 200 || obj.status === 201) {
                    msg.style.color = "var(--pixel-green)";
                    msg.innerText = "THÀNH CÔNG! ĐANG ĐIỀU HƯỚNG VÀO CHIẾN TRƯỜNG...";

                    const userData = obj.body.user || { id: obj.body.user_id, username: user };
                    localStorage.setItem("user_id", userData.id);
                    localStorage.setItem("username", userData.username);

                    setTimeout(() => { window.location.href = '/dashboard'; }, 1000);
                } else {
                    msg.style.color = "var(--neon-pink)";
                    msg.innerText = `LỖI: ${obj.body.error}`;
                }
            });
        }
    </script>
</body>
</html>
