<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Fluent - Portal Authentication</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .tab-btn {
            flex: 1;
            background: rgba(0,0,0,0.4);
            border: 2px solid var(--glass-border);
            color: #94a3b8;
            padding: 12px;
            cursor: pointer;
            font-family: var(--text-pixel);
            font-size: 10px;
            transition: all 0.3s;
        }
        .tab-btn.active {
            background: rgba(6, 182, 212, 0.2);
            border-color: var(--neon-cyan);
            color: var(--neon-cyan);
        }
    </style>
</head>
<body>

    <div class="bento-container" style="margin-top: 10vh; max-width: 450px;">
        <div class="bento-card" style="grid-column: span 4; padding: 35px;">
            <div class="pixel-title" style="font-size: 18px; color: var(--neon-pink); text-align: center; margin-bottom: 25px;">
                GLOBAL FLUENT
            </div>

            <!-- TABS -->
            <div style="display: flex; gap: 10px; margin-bottom: 25px;">
                <button class="tab-btn active" id="tab-login" onclick="switchTab('login')">LOGIN</button>
                <button class="tab-btn" id="tab-register" onclick="switchTab('register')">REGISTER</button>
            </div>

            <div style="margin-bottom: 20px;">
                <div class="pixel-title" style="font-size: 10px; margin-bottom: 8px;">PLAYER_NAME:</div>
                <input type="text" id="username" class="auth-input" placeholder="Nhập tên tài khoản...">
            </div>

            <div style="margin-bottom: 30px;">
                <div class="pixel-title" style="font-size: 10px; margin-bottom: 8px;">ACCESS_PASSWORD:</div>
                <input type="password" id="password" class="auth-input" placeholder="Nhập mật khẩu...">
            </div>

            <div style="display: flex; flex-direction: column; gap: 15px;">
                <button id="btn-submit" class="pixel-btn" style="background: var(--neon-cyan); color: #000; width: 100%; font-size: 12px;" onclick="handleAuth()">XÁC NHẬN ĐĂNG NHẬP</button>
            </div>

            <div class="pixel-text" id="auth-msg" style="font-size: 14px; color: var(--neon-pink); margin-top: 20px; text-align: center; display: none;"></div>
        </div>
    </div>

    <script>
        let currentMode = 'login';

        function switchTab(mode) {
            currentMode = mode;
            document.getElementById('auth-msg').style.display = 'none';
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';

            const btnSubmit = document.getElementById('btn-submit');
            const tabLogin = document.getElementById('tab-login');
            const tabRegister = document.getElementById('tab-register');

            if (mode === 'login') {
                tabLogin.classList.add('active');
                tabRegister.classList.remove('active');
                btnSubmit.innerText = "XÁC NHẬN ĐĂNG NHẬP";
                btnSubmit.style.background = "var(--neon-cyan)";
            } else {
                tabRegister.classList.add('active');
                tabLogin.classList.remove('active');
                btnSubmit.innerText = "TẠO TÀI KHOẢN MỚI";
                btnSubmit.style.background = "var(--pixel-green)";
            }
        }

        function handleAuth() {
            const user = document.getElementById("username").value.trim();
            const pass = document.getElementById("password").value.trim();
            const msg = document.getElementById("auth-msg");

            if(!user || !pass) {
                msg.style.display = "block";
                msg.style.color = "var(--neon-pink)";
                msg.innerText = "LỖI: Không được bỏ trống thông tin!";
                return;
            }

            msg.style.display = "block";
            msg.style.color = "var(--neon-amber)";
            msg.innerText = "ĐANG XỬ LÝ DỮ LIỆU LÕI...";

            fetch(`/api/auth/${currentMode}`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ username: user, password: pass })
            })
            .then(res => res.json().then(data => ({ status: res.status, body: data })))
            .then(obj => {
                if(obj.status === 200 || obj.status === 201) {
                    msg.style.color = "var(--pixel-green)";
                    msg.innerText = "THÀNH CÔNG! ĐANG ĐIỀU HƯỚNG VÀO CHIẾN TRƯỜNG...";

                    const userData = obj.body.user || { id: obj.body.user_id, username: user };
                    localStorage.setItem("user_id", userData.id);
                    localStorage.setItem("username", userData.username);

                    setTimeout(() => { window.location.href = '/dashboard'; }, 1000);
                } else {
                    msg.style.color = "var(--neon-pink)";
                    msg.innerText = `LỖI: ${obj.body.error}`;
                }
            });
        }

        // Hỗ trợ gõ phím Enter để thao tác nhanh
        document.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                handleAuth();
            }
        });
    </script>
</body>
</html>
