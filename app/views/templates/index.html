<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Fluent - Retro RPG</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <div class="bento-container" style="margin-top: 10vh;">

        <div class="bento-card card-large" style="grid-column: span 4; text-align: center; padding: 60px 20px;">
            <div style="margin-bottom: 30px;">
                <div class="pixel-avatar" style="transform: scale(2.5); margin-bottom: 50px;"></div>
            </div>

            <div class="pixel-title" style="font-size: 38px; color: var(--neon-pink); text-shadow: 4px 4px 0px #000;">
                GLOBAL FLUENT
            </div>

            <div style="display: inline-block; margin: 20px auto;">
                <p class="pixel-text typing-effect" style="font-size: 22px; color: var(--neon-cyan);">
                    [ HỆ THỐNG GIẢ LẬP SINH TỒN TIẾNG ANH ]
                </p>
            </div>

            <div class="pixel-text" style="font-size: 16px; color: #94a3b8; max-width: 600px; margin: 0 auto 30px auto; line-height: 1.6;">
                Nói/Gõ để chiến đấu. Chấp nhận thử thách ngữ pháp. Chịu đựng những trận sỉ vả thời gian thực từ AI Master G hoặc trở thành Huyền Thoại Ngôn Ngữ!
            </div>

            <div>
                <button class="pixel-btn" onclick="window.location.href='/auth'" style="background: var(--neon-pink); font-size: 16px; padding: 18px 36px; box-shadow: -4px 0 0 0 #000, 4px 0 0 0 #000, 0 -4px 0 0 #000, 0 4px 0 0 #000, inset -4px -4px 0 0 #9d174d;">
                    CHẤP NHẬN THỬ THÁCH (ENTER GAME)
                </button>
            </div>
        </div>

    </div>

</body>
</html>
